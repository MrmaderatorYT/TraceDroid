// TraceDroid application module. Pure Java 17 + C++20 (NDK). No Kotlin sources or Kotlin Gradle plugin.
plugins {
    id 'com.android.application'
}

def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}

android {
    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    namespace 'com.ccs.tracedroid'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.ccs.chronosec'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0 Preview'

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DTD_WITH_YARA=ON'
                cFlags '-fvisibility=hidden'
                cppFlags '-fvisibility=hidden'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // The parsers are far too slow at -O0 for real incident dumps; keep debug info but optimise.
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_BUILD_TYPE=RelWithDebInfo'
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}

// Offline guarantee: fail the build if any dependency smuggles a network permission into the merged manifest.
androidComponents {
    onVariants(selector().all()) { variant ->
        def cap = variant.name.capitalize()
        tasks.register("verifyOffline${cap}") {
            def manifest = variant.artifacts.get(com.android.build.api.artifact.SingleArtifact.MERGED_MANIFEST.INSTANCE)
            inputs.file(manifest)
            doLast {
                def text = manifest.get().asFile.text
                ['android.permission.INTERNET', 'android.permission.ACCESS_NETWORK_STATE',
                 'android.permission.ACCESS_WIFI_STATE'].each { perm ->
                    if (text.contains(perm)) {
                        throw new GradleException("Offline policy violation: merged manifest requests ${perm}")
                    }
                }
            }
        }
        afterEvaluate {
            tasks.named("assemble${cap}").configure { dependsOn "verifyOffline${cap}" }
        }
    }
}
